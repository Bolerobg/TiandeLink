services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: saaslink
      POSTGRES_USER: saaslink
      POSTGRES_PASSWORD: saaslink
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saaslink -d saaslink"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  web:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://saaslink:saaslink@postgres:5432/saaslink?schema=public
      NEXT_PUBLIC_APP_URL: https://lookthis.info
      HOSTNAME: 0.0.0.0
      PORT: 3000
    networks:
      - internal
      - proxy
    command: sh -c "./node_modules/.bin/prisma migrate deploy && node server.js"

  nginx-proxy:
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - npm-data:/data
      - npm-letsencrypt:/etc/letsencrypt
    networks:
      - proxy

volumes:
  postgres-data:
  npm-data:
  npm-letsencrypt:

networks:
  internal:
  proxy:
